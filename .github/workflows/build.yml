name: build-ipa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Proje üret
        run: brew install xcodegen && xcodegen generate
      - name: Derle (imzasız) ve paketle
        run: |
          for app in Atlas AtlasProbe; do
            xcodebuild -project Atlas.xcodeproj -scheme "$app" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "build-$app.log" 2>&1 \
              || { grep -E "error:|fatal" -A4 "build-$app.log" | head -80; exit 1; }
            grep -c "warning:" "build-$app.log" || true
            rm -rf Payload && mkdir Payload
            cp -R "build/Build/Products/Release-iphoneos/$app.app" Payload/
            zip -qry "$app.ipa" Payload
          done
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
          retention-days: 14
